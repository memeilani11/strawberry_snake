<!DOCTYPE html>
<html>
<head>
  <title>Game Ular</title>
  <style>
    body { background: #111; color: #0f0; text-align: center; font-family: monospace; margin: 0; padding: 20px; }
    canvas { background: #000; border: 2px solid #0f0; display: block; margin: 10px auto; }
    h1 { font-size: 20px; }
    #score { font-size: 16px; margin: 8px; }
  </style>
</head>
<body>
  <h1>🐍 GAME ULAR</h1>
  <div id="score">Skor: 0</div>
  <canvas id="game" width="300" height="300"></canvas>
  <p>Pakai tombol panah / swipe untuk gerak</p>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const box = 15;
    let snake, dir, food, score, gameLoop;

    function init() {
      snake = [{x: 10, y: 10}];
      dir = {x: 0, y: 0};
      food = randomFood();
      score = 0;
      document.getElementById('score').textContent = 'Skor: 0';
      clearInterval(gameLoop);
      gameLoop = setInterval(draw, 120);
    }

    function randomFood() {
      return {
        x: Math.floor(Math.random() * 20),
        y: Math.floor(Math.random() * 20)
      };
    }

    function draw() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, 300, 300);

      // makanan
      ctx.fillStyle = 'red';
      ctx.fillRect(food.x * box, food.y * box, box, box);

      // ular
      for (let i = 0; i < snake.length; i++) {
        ctx.fillStyle = i === 0 ? '#0f0' : '#0a0';
        ctx.fillRect(snake[i].x * box, snake[i].y * box, box - 1, box - 1);
      }

      // gerak
      let head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

      // tembus dinding (bisa diubah jadi game over kalau mau)
      if (head.x < 0) head.x = 19;
      if (head.x > 19) head.x = 0;
      if (head.y < 0) head.y = 19;
      if (head.y > 19) head.y = 0;

      // tabrak diri sendiri
      for (let i = 0; i < snake.length; i++) {
        if (snake[i].x === head.x && snake[i].y === head.y) {
          clearInterval(gameLoop);
          setTimeout(() => { alert('Game Over! Skor: ' + score); init(); }, 100);
          return;
        }
      }

      // makan
      if (head.x === food.x && head.y === food.y) {
        score++;
        document.getElementById('score').textContent = 'Skor: ' + score;
        food = randomFood();
      } else {
        snake.pop();
      }

      snake.unshift(head);
    }

    // kontrol keyboard
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowUp' && dir.y === 0) dir = {x: 0, y: -1};
      if (e.key === 'ArrowDown' && dir.y === 0) dir = {x: 0, y: 1};
      if (e.key === 'ArrowLeft' && dir.x === 0) dir = {x: -1, y: 0};
      if (e.key === 'ArrowRight' && dir.x === 0) dir = {x: 1, y: 0};
    });

    // kontrol swipe HP
    let touchX, touchY;
    canvas.addEventListener('touchstart', e => {
      touchX = e.touches[0].clientX;
      touchY = e.touches[0].clientY;
    });
    canvas.addEventListener('touchend', e => {
      let dx = e.changedTouches[0].clientX - touchX;
      let dy = e.changedTouches[0].clientY - touchY;
      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 0 && dir.x === 0) dir = {x: 1, y: 0};
        else if (dx < 0 && dir.x === 0) dir = {x: -1, y: 0};
      } else {
        if (dy > 0 && dir.y === 0) dir = {x: 0, y: 1};
        else if (dy < 0 && dir.y === 0) dir = {x: 0, y: -1};
      }
    });

    init();
  </script>
</body>
</html>
