<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Strawberry Snake</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#f4ecfa;
    font-family:system-ui,sans-serif;user-select:none}

  /* ===== LOADING SCREEN ===== */
  #loader{
    position:fixed;inset:0;background:linear-gradient(160deg,#ffe1ee,#f4ecfa 60%,#ebdcfa);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:22px;z-index:100;
    transition:opacity .5s ease, visibility .5s ease;
  }
  #loader.hide{opacity:0;visibility:hidden}
  #loader .berry{font-size:64px;animation:spin 1.6s linear infinite;
    filter:drop-shadow(0 6px 12px rgba(230,100,160,.4))}
  #loader h2{color:#7d5aaa;font-size:20px;letter-spacing:2px}
  #loader .bar{width:220px;height:10px;background:#fff;border:2px solid #dcbedc;
    border-radius:10px;overflow:hidden}
  #loader .bar > div{height:100%;width:0%;border-radius:10px;
    background:linear-gradient(90deg,#ff91b9,#b491e1);
    transition:width .25s ease}
  #loader .pct{color:#e664a0;font-size:13px;font-weight:700}
  @keyframes spin{
    0%{transform:rotate(0) scale(1)}
    50%{transform:rotate(180deg) scale(1.15)}
    100%{transform:rotate(360deg) scale(1)}
  }

  /* ===== HEADER ===== */
  #hdr{background:#ffe1ee;padding:6px;text-align:center}
  #hdr h1{color:#7d5aaa;font-size:15px;margin-bottom:4px}
  #stats{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
  .st{background:#fff;border:2px solid #b491e1;border-radius:8px;
    padding:3px 10px;font-size:12px;color:#7d5aaa;font-weight:700}
  .st span{color:#e664a0}

  /* ===== STAGE (VERTIKAL) ===== */
  #stage{display:flex;flex-direction:column;align-items:center;
    gap:8px;padding:8px;height:calc(100% - 62px);min-height:0}
  #boardWrap{flex:1;display:flex;align-items:center;justify-content:center;
    min-height:0;width:100%}
  canvas{background:#fffafd;border:3px solid #ff91b9;border-radius:12px;
    display:block;touch-action:none;max-width:100%;max-height:100%}

  /* ===== BARIS BAWAH: TOMBOL (KIRI) + JOYSTICK (KANAN) ===== */
  #bottomRow{display:flex;gap:10px;align-items:center;justify-content:center;
    width:100%;flex-shrink:0}

  /* Tombol PAUSE & RESET di kiri */
  #btnCol{display:flex;flex-direction:column;gap:8px}
  #btnCol button{background:#b491e1;color:#fff;border:none;border-radius:12px;
    padding:12px 24px;font-weight:700;font-size:14px;
    box-shadow:0 3px 0 #7d5aaa;cursor:pointer;min-width:110px}
  #btnCol button:active{transform:translateY(2px);box-shadow:0 1px 0 #7d5aaa}

  /* Joystick di kanan */
  #joyWrap{background:#f8e8f5;border:2px solid #dcbedc;border-radius:16px;
    padding:8px 14px;display:flex;align-items:center;gap:10px;
    touch-action:none}
  #joy{width:100px;height:100px;border-radius:50%;background:#fff;
    border:5px solid #dcbedc;position:relative;touch-action:none;
    box-shadow:inset 0 0 12px rgba(180,145,225,.25)}
  #knob{width:42px;height:42px;border-radius:50%;background:#ff91b9;
    border:3px solid #e664a0;position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%);pointer-events:none;
    box-shadow:inset -3px -3px 8px rgba(255,255,255,.5)}
  #joyLabel{color:#7d5aaa;font-size:10px;font-weight:700;letter-spacing:1px;
    writing-mode:vertical-rl}

  /* ===== OVERLAY GAME OVER ===== */
  #overlay{position:fixed;inset:0;background:rgba(80,50,90,.88);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;z-index:10;padding:20px;text-align:center}
  #overlay.hide{display:none}
  #overlay h1{color:#fff;font-size:28px;line-height:1.2;text-shadow:2px 2px 0 #7d5aaa}
  #overlay p{color:#ffd;font-size:14px}
  #overlay button{background:#ff91b9;color:#fff;border:none;padding:14px 40px;
    font-size:18px;font-weight:700;border-radius:14px;box-shadow:0 4px 0 #e664a0}
  #overlay button:active{transform:translateY(2px);box-shadow:0 2px 0 #e664a0}

  @media(max-width:380px){
    #joy{width:84px;height:84px}
    #knob{width:36px;height:36px}
    #btnCol button{padding:10px 16px;font-size:13px;min-width:90px}
  }
  @media(max-height:640px){
    #joy{width:84px;height:84px}
    #knob{width:34px;height:34px}
    #btnCol button{padding:8px 16px;font-size:12px}
  }
</style>
</head>
<body>

<!-- ============ LOADING SCREEN ============ -->
<div id="loader">
  <div class="berry">🍓</div>
  <h2>STRAWBERRY SNAKE</h2>
  <div class="bar"><div id="barFill"></div></div>
  <div class="pct" id="pctTxt">0%</div>
</div>

<!-- ============ HEADER ============ -->
<div id="hdr">
  <h1>🍓 STRAWBERRY SNAKE GAME</h1>
  <div id="stats">
    <div class="st">SCORE <span id="sc">0</span></div>
    <div class="st">BEST <span id="bs">0</span></div>
    <div class="st">FOOD <span id="fd">5</span></div>
  </div>
</div>

<!-- ============ STAGE ============ -->
<div id="stage">
  <div id="boardWrap"><canvas id="cv"></canvas></div>

  <!-- Tombol (kiri) + Joystick (kanan) -->
  <div id="bottomRow">
    <div id="btnCol">
      <button id="pauseBtn">PAUSE</button>
      <button id="resetBtn">RESET</button>
    </div>

    <div id="joyWrap">
      <div id="joyLabel">JOYSTICK</div>
      <div id="joy"><div id="knob"></div></div>
    </div>
  </div>
</div>

<!-- ============ GAME OVER ============ -->
<div id="overlay" class="hide">
  <h1 id="ovT">GAME OVER</h1>
  <p id="ovS">Skor: 0</p>
  <button id="ovB">MAIN LAGI</button>
</div>

<script>
(function(){
  "use strict";

  /* ================= LOADING ================= */
  var barFill = document.getElementById('barFill');
  var pctTxt  = document.getElementById('pctTxt');
  var loader  = document.getElementById('loader');
  var loaded  = false;
  var pct     = 0;

  var fakeTimer = setInterval(function(){
    if (loaded) return;
    pct += Math.random() * 8 + 2;
    if (pct > 90) pct = 90;
    barFill.style.width = pct + '%';
    pctTxt.textContent = Math.floor(pct) + '%';
  }, 90);

  function finishLoading(){
    if (loaded) return;
    loaded = true;
    clearInterval(fakeTimer);
    barFill.style.width = '100%';
    pctTxt.textContent = '100%';
    setTimeout(function(){
      loader.classList.add('hide');
      reset();
      running = true;
      requestAnimationFrame(loop);
    }, 400);
  }

  /* ================= GAME ================= */
  var CV  = document.getElementById('cv');
  var ctx = CV.getContext('2d');

  var G = 20;
  var COLS = 13;
  var ROWS = 18;
  var W = COLS * G;
  var H = ROWS * G;

  var FOOD_N  = 5;
  var STEP_MS = 180;

  CV.width  = W;
  CV.height = H;

  var snake, dir, nextDir, foods, score, best;
  var running = false, paused = false, acc = 0, lastT = 0;

  best = parseInt(localStorage.getItem('ssBest') || '0', 10) || 0;
  document.getElementById('bs').textContent = best;

  // ============ GAMBAR ============
  function drawStrawberry(px, py){
    var cx = px + G/2, cy = py + G/2, r = G * 0.4;
    ctx.fillStyle = '#f04664';
    ctx.beginPath(); ctx.arc(cx - r*0.5, cy - r*0.05, r*0.55, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + r*0.5, cy - r*0.05, r*0.55, 0, Math.PI*2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx - r*0.85, cy);
    ctx.lineTo(cx + r*0.85, cy);
    ctx.lineTo(cx, cy + r*0.95);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#a0dcb4';
    ctx.beginPath();
    ctx.moveTo(cx, cy - r*0.5);
    ctx.lineTo(cx - r*0.5, cy - r*0.9);
    ctx.lineTo(cx - r*0.08, cy - r*0.3);
    ctx.lineTo(cx + r*0.15, cy - r*0.95);
    ctx.lineTo(cx + r*0.5, cy - r*0.35);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffdc78';
    ctx.beginPath(); ctx.arc(cx - r*0.35, cy - r*0.05, 1.4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + r*0.35, cy - r*0.05, 1.4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy + r*0.3, 1.4, 0, Math.PI*2); ctx.fill();
  }

  function drawHead(px, py){
    ctx.fillStyle = '#ff91b9';
    ctx.fillRect(px+1, py+1, G-2, G-2);

    var e1x, e1y, e2x, e2y;
    if (dir.x === 1)       { e1x = px+G*0.68; e1y = py+G*0.35; e2x = px+G*0.68; e2y = py+G*0.65; }
    else if (dir.x === -1) { e1x = px+G*0.32; e1y = py+G*0.35; e2x = px+G*0.32; e2y = py+G*0.65; }
    else if (dir.y === -1) { e1x = px+G*0.35; e1y = py+G*0.32; e2x = px+G*0.65; e2y = py+G*0.32; }
    else                   { e1x = px+G*0.35; e1y = py+G*0.68; e2x = px+G*0.65; e2y = py+G*0.68; }

    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(e1x, e1y, G*0.13, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(e2x, e2y, G*0.13, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(e1x, e1y, G*0.06, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(e2x, e2y, G*0.06, 0, Math.PI*2); ctx.fill();
  }

  function render(){
    ctx.fillStyle = '#fffafd';
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = '#eee1ed';
    ctx.lineWidth = 1;
    for (var x = 0; x <= COLS; x++) {
      ctx.beginPath(); ctx.moveTo(x*G, 0); ctx.lineTo(x*G, H); ctx.stroke();
    }
    for (var y = 0; y <= ROWS; y++) {
      ctx.beginPath(); ctx.moveTo(0, y*G); ctx.lineTo(W, y*G); ctx.stroke();
    }

    for (var i = 0; i < foods.length; i++) {
      drawStrawberry(foods[i].x * G, foods[i].y * G);
    }

    for (var j = 0; j < snake.length; j++) {
      var s = snake[j];
      if (j === 0) {
        drawHead(s.x * G, s.y * G);
      } else {
        ctx.fillStyle = j % 2 === 0 ? '#ffe1ee' : '#ebdcfa';
        ctx.fillRect(s.x*G + 1, s.y*G + 1, G - 2, G - 2);
      }
    }

    if (paused) {
      ctx.fillStyle = 'rgba(80,50,90,.55)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 30px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('PAUSED', W/2, H/2);
      ctx.textAlign = 'left';
    }
  }

  // ============ LOGIKA ============
  function randFood(){
    var occupied = {};
    for (var i = 0; i < snake.length; i++) occupied[snake[i].x + ',' + snake[i].y] = 1;
    for (var k = 0; k < foods.length; k++) occupied[foods[k].x + ',' + foods[k].y] = 1;
    var free = [];
    for (var x = 0; x < COLS; x++) {
      for (var y = 0; y < ROWS; y++) {
        if (!occupied[x + ',' + y]) free.push({x:x, y:y});
      }
    }
    if (!free.length) return null;
    return free[Math.floor(Math.random() * free.length)];
  }

  function fillFoods(){
    var guard = 0;
    while (foods.length < FOOD_N && guard++ < 300) {
      var f = randFood();
      if (!f) break;
      foods.push(f);
    }
    document.getElementById('fd').textContent = foods.length;
  }

  function reset(){
    var cx = Math.floor(COLS / 2);
    var cy = Math.floor(ROWS / 2);
    snake = [
      {x: cx,     y: cy},
      {x: cx - 1, y: cy},
      {x: cx - 2, y: cy},
      {x: cx - 3, y: cy}
    ];
    dir = {x:1, y:0};
    nextDir = {x:1, y:0};
    foods = [];
    score = 0;
    acc = 0;
    paused = false;
    document.getElementById('sc').textContent = '0';
    fillFoods();
    render();
  }

  function setDir(nx, ny){
    if (nx === -dir.x && ny === -dir.y) return;
    nextDir = {x:nx, y:ny};
  }

  function tick(){
    dir = nextDir;
    var head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      return gameOver();
    }
    for (var i = 0; i < snake.length - 1; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) return gameOver();
    }

    snake.unshift(head);
    var eaten = false;
    for (var k = 0; k < foods.length; k++) {
      if (foods[k].x === head.x && foods[k].y === head.y) {
        foods.splice(k, 1);
        eaten = true;
        break;
      }
    }
    if (eaten) {
      score++;
      document.getElementById('sc').textContent = score;
      if (score > best) {
        best = score;
        localStorage.setItem('ssBest', String(best));
        document.getElementById('bs').textContent = best;
      }
      fillFoods();
    } else {
      snake.pop();
    }
  }

  function gameOver(){
    running = false;
    document.getElementById('ovT').textContent = 'GAME OVER';
    document.getElementById('ovS').textContent = 'Skor: ' + score + ' | Best: ' + best;
    document.getElementById('overlay').classList.remove('hide');
  }

  function loop(t){
    if (!lastT) lastT = t;
    var dt = t - lastT;
    lastT = t;
    if (dt > 250) dt = 250;
    if (running && !paused) {
      acc += dt;
      var guard = 0;
      while (acc >= STEP_MS && guard++ < 5) {
        acc -= STEP_MS;
        tick();
      }
    }
    render();
    requestAnimationFrame(loop);
  }

  // ============ KEYBOARD ============
  window.addEventListener('keydown', function(e){
    var k = e.key.toLowerCase();
    if (k === 'arrowup' || k === 'w')    setDir(0, -1);
    else if (k === 'arrowdown' || k === 's')  setDir(0, 1);
    else if (k === 'arrowleft' || k === 'a')  setDir(-1, 0);
    else if (k === 'arrowright' || k === 'd') setDir(1, 0);
    else if (k === 'p') paused = !paused;
    if (['arrowup','arrowdown','arrowleft','arrowright'].indexOf(k) >= 0) e.preventDefault();
  }, {passive:false});

  // ============ SWIPE ============
  var sx = 0, sy = 0;
  CV.addEventListener('touchstart', function(e){
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
  }, {passive:true});
  CV.addEventListener('touchend', function(e){
    var dx = e.changedTouches[0].clientX - sx;
    var dy = e.changedTouches[0].clientY - sy;
    if (Math.sqrt(dx*dx + dy*dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
  }, {passive:true});

  // ============ JOYSTICK ============
  var joy = document.getElementById('joy');
  var knob = document.getElementById('knob');
  var joyActive = false;

  function joyMove(clientX, clientY){
    var r = joy.getBoundingClientRect();
    var cx = r.left + r.width / 2;
    var cy = r.top + r.height / 2;
    var dx = clientX - cx;
    var dy = clientY - cy;
    var maxR = r.width / 2 - 18;
    var d = Math.sqrt(dx*dx + dy*dy);
    if (d > maxR) { dx = dx / d * maxR; dy = dy / d * maxR; }
    knob.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
    if (d < 10) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
  }
  function joyReset(){
    joyActive = false;
    knob.style.transform = 'translate(-50%,-50%)';
  }

  joy.addEventListener('touchstart', function(e){
    joyActive = true;
    joyMove(e.touches[0].clientX, e.touches[0].clientY);
    e.preventDefault();
  }, {passive:false});
  joy.addEventListener('touchmove', function(e){
    if (joyActive) {
      joyMove(e.touches[0].clientX, e.touches[0].clientY);
      e.preventDefault();
    }
  }, {passive:false});
  joy.addEventListener('touchend', function(e){
    joyReset(); e.preventDefault();
  }, {passive:false});
  joy.addEventListener('touchcancel', joyReset);
  joy.addEventListener('mousedown', function(e){
    joyActive = true;
    joyMove(e.clientX, e.clientY);
    e.preventDefault();
  });
  window.addEventListener('mousemove', function(e){
    if (joyActive) joyMove(e.clientX, e.clientY);
  });
  window.addEventListener('mouseup', function(){ if (joyActive) joyReset(); });

  // ============ TOMBOL ============
  document.getElementById('pauseBtn').onclick = function(){
    if (running) paused = !paused;
  };
  document.getElementById('resetBtn').onclick = function(){
    document.getElementById('overlay').classList.add('hide');
    reset();
    running = true;
  };
  document.getElementById('ovB').onclick = function(){
    document.getElementById('overlay').classList.add('hide');
    reset();
    running = true;
  };

  /* ================= START LOADING ================= */
  if (document.readyState === 'complete') {
    setTimeout(finishLoading, 700);
  } else {
    window.addEventListener('load', function(){
      setTimeout(finishLoading, 700);
    });
    setTimeout(finishLoading, 3500);
  }

  ctx.fillStyle = '#fffafd';
  ctx.fillRect(0, 0, W, H);
})();
</script>
</body>
</html>
